# The repo root is a virtual workspace: no package of its own, one member per
# binary project under `bin/`. To add a project, copy `bin/hello-world` to
# `bin/<project>` and rename the package — the glob picks the new directory up.
# `.gitignore` keeps every `bin/` project but `hello-world` out of this repo.
#
# `xtask` is a member so `cargo xtask …` works from any directory under the repo
# root: a cargo alias resolves `--manifest-path` against the cwd, but `-p xtask`
# resolves against the workspace. It is dependency-free, so sharing the root
# lockfile costs nothing.
[workspace]
resolver = "3"
members = ["bin/*", "xtask"]

# rust-mos-env's own version — the environment: toolchain pins, flake, xtask and
# the project scaffolding. It moved here when the root stopped being a package.
# Projects under `bin/` version themselves; nothing inherits this by default.
[workspace.package]
version = "0.1.5"

# Cargo honours `[profile]` only in the workspace root, so these settings apply
# to every `bin/` project.
[profile.release]
opt-level = 3
# Load-bearing, not a size tweak: fat LTO defers dependency codegen to the link,
# where dead code is dropped first. Without it llvm-mos aborts legalizing the
# 128-bit remainder in `core::fmt::num::exp_u128` — a function no 6502 program
# calls, but one that eager codegen still hands to the backend.
lto = "fat"
panic = "abort"
# Suppress linker warning
strip = true

[profile.dev]
opt-level = 2
lto = "thin"
# Also on the host: a no_std project with its own panic handler cannot unwind, so
# a host build fails without this — and cargo reprints a build script's warnings
# when the build fails, doubling the one build.rs emits.
panic = "abort"

# No overflow-checks override here, deliberately: dev overflow checks crash the
# 45GS02 backend, but a `[profile]` cannot be conditioned on the target, and
# disabling them repo-wide would cost the C64 and host builds a check they have
# no problem with. The MEGA65 workaround rides on `--target mega65` instead —
# see Target::cargo_flags in xtask/src/target.rs.
