[package]
name = "hello-world"
version = "0.1.0"
edition = "2021"

# No dependencies: core/alloc come from -Zbuild-std against the toolchain's
# bundled rust-src; compiler_builtins is injected by the forked cargo.
[dependencies]

# The mos target spec sets requires_lto; older toolchains additionally died
# in core's u128 codegen without LTO (LLVM ERROR: unable to legalize ... s128)
# and every known-good 1.87 build had LTO on. Keep it on in both profiles.
[profile.dev]
lto = true
panic = "abort"

[profile.release]
lto = true
panic = "abort"
opt-level = "s"
codegen-units = 1
