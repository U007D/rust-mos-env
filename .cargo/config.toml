# Canonical cargo-xtask wiring (https://github.com/matklad/cargo-xtask):
# `cargo xtask <task>` from the repo root. Aliases are inert for ordinary
# `cargo build` invocations elsewhere in the tree (e.g. checks/c64-prg).
#
# Note: the manifest path is relative to the invocation directory, so
# `cargo xtask` works from the repo root (the tasks themselves locate the
# repo via CARGO_MANIFEST_DIR, not the cwd).
[alias]
xtask = "run --manifest-path xtask/Cargo.toml --"
xinitenv = "xtask initenv"

# Note: `cargo xasm` (show a C64 crate's assembly) is NOT a cargo alias. An alias
# resolves `--manifest-path xtask/Cargo.toml` against the cwd, so it would only
# work from the repo root. Instead the dev shell puts a `cargo-xasm` binary on
# PATH (see flake.nix), which cargo runs for `cargo xasm` from any crate
# directory. There are likewise no `xbuild`/`xcheck` aliases: a C64 crate that
# ships `.cargo/config.toml` with `[build] target = "mos-c64-none"` (see
# c64/examples/hello-world) makes plain `cargo build`/`check` target mos already.
